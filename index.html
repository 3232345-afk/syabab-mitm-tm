<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pusat Arkib Digital SYABAB MITM</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-4">

  <!-- Header Section -->
  <div class="max-w-md mx-auto text-center my-6">
    <span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wide">
      ● SISTEM ARKIB RASMI
    </span>
    <div class="w-20 h-20 bg-white rounded-full mx-auto my-4 shadow flex items-center justify-center border border-emerald-200">
      <i data-lucide="archive" class="w-10 h-10 text-emerald-600"></i>
    </div>
    <h1 class="text-2xl font-bold text-slate-900">Pusat Arkib Digital</h1>
    <p class="text-sm font-semibold text-emerald-700 mt-1">SYABAB MITM</p>
    <p class="text-xs text-slate-500 italic mt-1">"Memelihara Khazanah Intelek & Sejarah Pergerakan"</p>
  </div>

  <!-- Grid Kategori Arkib -->
  <div class="max-w-md mx-auto grid grid-cols-2 gap-4">
    
    <a href="#" class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col items-center justify-center hover:shadow-md transition text-center">
      <i data-lucide="file-text" class="w-8 h-8 text-emerald-600 mb-2"></i>
      <span class="text-xs font-bold text-slate-700">Laporan Muktamar</span>
    </a>

    <a href="#" class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col items-center justify-center hover:shadow-md transition text-center">
      <i data-lucide="users" class="w-8 h-8 text-blue-600 mb-2"></i>
      <span class="text-xs font-bold text-slate-700">Minit Mesyuarat</span>
    </a>

    <a href="#" class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col items-center justify-center hover:shadow-md transition text-center">
      <i data-lucide="book-open" class="w-8 h-8 text-amber-600 mb-2"></i>
      <span class="text-xs font-bold text-slate-700">Bahan Terbitan</span>
    </a>

    <a href="#" class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col items-center justify-center hover:shadow-md transition text-center">
      <i data-lucide="camera" class="w-8 h-8 text-pink-600 mb-2"></i>
      <span class="text-xs font-bold text-slate-700">Foto & Video</span>
    </a>

    <a href="#" class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col items-center justify-center hover:shadow-md transition text-center">
      <i data-lucide="file-check" class="w-8 h-8 text-purple-600 mb-2"></i>
      <span class="text-xs font-bold text-slate-700">Kertas Kerja & Brosur</span>
    </a>

    <a href="#" class="bg-white p-5 rounded-2xl shadow-sm border flex flex-col items-center justify-center hover:shadow-md transition text-center">
      <i data-lucide="star" class="w-8 h-8 text-yellow-500 mb-2"></i>
      <span class="text-xs font-bold text-slate-700">Koleksi Saya</span>
    </a>

  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
